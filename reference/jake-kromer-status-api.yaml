openapi: 3.0.3
info:
  title: Jake Kromer Status API
  version: 1.0.0
  description: >
    An unofficial API for checking Jake's current status. Uptime has been
    excellent since 2012. No SLA, but he'll tell you honestly if something's on
    fire.
servers:
  - url: https://beacon.techwithjake.com
paths:
  /availability:
    get:
      summary: Check current availability for new roles
      responses:
        '200':
          description: Availability status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: actively interviewing
                  remote:
                    type: boolean
                    example: true
                  relocation_open:
                    type: boolean
                    example: false
                    default: 'false'
  /skills:
    get:
      summary: List current technical skills
      responses:
        '200':
          description: A list of skills, ranked honestly rather than generously
          content:
            application/json:
              schema:
                type: object
                properties:
                  strong:
                    type: array
                    items:
                      type: string
                    example:
                      - API debugging
                      - Root cause analysis
                      - Python
                      - Linux
                      - Swagger/OpenAPI
                  learning:
                    type: array
                    items:
                      type: string
                    example:
                      - Modern front-end/JS tooling
  /coffee-level:
    get:
      summary: Check current caffeine saturation
      responses:
        '200':
          description: Coffee level, self-reported
          content:
            application/json:
              schema:
                type: object
                properties:
                  level:
                    type: string
                    enum:
                      - optimal
                      - nominal
                      - low
                      - do-not-approach
                    example: optimal
components:
  schemas: {}
